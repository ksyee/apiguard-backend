services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apiguard-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-apiguard}
      DB_USERNAME: ${POSTGRES_USER:-apiguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
    networks:
      - apiguard-network

  db:
    image: postgres:18
    container_name: apiguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apiguard}
      POSTGRES_USER: ${POSTGRES_USER:-apiguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apiguard} -d ${POSTGRES_DB:-apiguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - apiguard-network

  redis:
    image: redis:8-alpine
    container_name: apiguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - apiguard-network

networks:
  apiguard-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
