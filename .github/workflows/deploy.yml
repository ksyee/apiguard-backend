name: Deploy To Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT != '' && vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH != '' && vars.DEPLOY_PATH || format('/home/{0}/apps/apiguard', secrets.DEPLOY_USER) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build deployable JAR
        run: ./gradlew bootJar --no-daemon -x test

      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/apiguard-backend.jar

      - name: Ensure remote deploy path exists
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script: |
            mkdir -p "${DEPLOY_PATH}"

      - name: Upload deploy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          source: "dist/apiguard-backend.jar,docker-compose.server.yml,Dockerfile.deploy"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script: |
            cd "${DEPLOY_PATH}"

            dump_logs() {
              docker compose -f docker-compose.server.yml ps || true
              docker compose -f docker-compose.server.yml logs db --tail=200 || true
              docker compose -f docker-compose.server.yml logs redis --tail=200 || true
              docker compose -f docker-compose.server.yml logs app --tail=200 || true
            }

            if ! docker compose -f docker-compose.server.yml up -d --build; then
              dump_logs
              exit 1
            fi

            set -a
            [ -f .env ] && . ./.env
            set +a

            for i in $(seq 1 12); do
              if curl -fsS "http://127.0.0.1:${APP_PORT:-8080}/health" >/dev/null; then
                status_code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${APP_PORT:-8080}/status/__deploy_smoke_missing__")"
                if [ "${status_code}" = "404" ]; then
                  exit 0
                fi
                echo "DB-backed smoke check returned HTTP ${status_code}; expected 404"
              fi
              sleep 5
            done

            dump_logs
            exit 1
